[project]
name = "business-validation"
version = "0.1.0"
description = "Agentic pipeline that validates a business idea through simulated customer interviews"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2", "httpx"]

[project.optional-dependencies]
backend = ["fastapi", "uvicorn", "openai", "python-dotenv", "hermes-agent==0.19.0"]
frontend = ["streamlit", "pypdf"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_backend", "api_common", "frontend_demo"]
